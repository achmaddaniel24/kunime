name: kunime
description: "Watch anime for free"
publish_to: "none"
homepage: "https://github.com/kudanilll/kunime"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  card_swiper: ^3.0.1
  http: ^1.6.0
  cached_network_image: ^4.0.0
  shimmer: ^4.0.0
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  phosphoricons_flutter: ^1.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
